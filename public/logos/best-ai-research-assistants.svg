  <text x="164" y="324" fill="#143a38" font-family="Verdana, sans-serif" font-size="18" font-weight="700">Perplexity</text>
  <text x="164" y="354" fill="#385a57" font-family="Verdana, sans-serif" font-size="15">Best for web sources</text>
  <text x="164" y="388" fill="#143a38" font-family="Verdana, sans-serif" font-size="14">Citations first.</text>

